[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
census.workspace = true
datamodel.workspace = true
discovery.workspace = true
intake.workspace = true
probe.workspace = true
store.workspace = true
serde_json = "1.0.151"
# Named directly (not just transitively via `store`) so `probe_stage1.rs` can name
# `rusqlite::Connection` in its own function signatures. Same `0.32` line `store` already
# depends on — Cargo unifies features across one resolved version, so this does not need to
# repeat `store`'s `bundled` feature to get it.
rusqlite = "0.32"

[dev-dependencies]
# Same version `store` already uses for its own tests — no new crate in the lockfile.
tempfile = "3.27.0"
# Integration tests only (`tests/reason_codes.rs`). `verdict::reason` and `probe::protocol`
# each spell `invocation_failed` separately, because ADR-005 forbids an edge between those
# two crates in either direction, and `xtask` is the one crate that can see both at once to
# assert the spellings still agree. A dev-dependency, so no runtime edge is added and
# `cargo purity` (which excludes dev-dependencies by documented policy) is unaffected —
# `verdict`'s own closure is untouched either way, since this edge points at it.
verdict.workspace = true

[lints]
workspace = true
