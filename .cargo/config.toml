[alias]
xtask = "run --quiet --package xtask --bin xtask --"
# F-04: assert the ADR-005 purity firewall over the dependency graph.
purity = "run --quiet --package xtask --bin xtask -- purity"
# P0-08: run the Stage 0 registry census (registry metadata only, no third-party contact).
census = "run --quiet --package xtask --bin xtask -- census"
# P0-06/07 Stage 1: sample Class B servers and run initialize+tools/list against each.
census-stage1 = "run --quiet --package xtask --bin xtask -- census-stage1"
# P0-06: re-discover a prior Stage 1 run's successful servers twice and confirm pins match.
census-pin-stability = "run --quiet --package xtask --bin xtask -- census-pin-stability"
