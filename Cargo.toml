[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85.1"
publish = false

# Internal crates. See docs/architecture.md §8 for the component contracts and
# docs/adr/007-implementation-language.md for why the graph is shaped this way.
#
# `datamodel` is the shared vocabulary: pure data types, no behaviour, `no_std`.
# Dependencies point inward toward it, never outward from the pure crates.
#
# `evtree` is not in architecture.md §8's original crate list — added the same way
# `datamodel` and `xtask` were (F-02): a real gap found while implementing a task (P1-02)
# that needed it before the crate ADR-009 assigned it to (P1-04, `observe`) existed. It is
# the `evtree1` wire-format codec ADR-009 specifies; `world`'s base-layer builder is its
# first consumer, `observe` its next.
[workspace.dependencies]
datamodel = { path = "crates/datamodel" }
evtree = { path = "crates/evtree" }
intake = { path = "crates/intake" }
discovery = { path = "crates/discovery" }
census = { path = "crates/census" }
planner = { path = "crates/planner" }
world = { path = "crates/world" }
argsynth = { path = "crates/argsynth" }
sandbox = { path = "crates/sandbox" }
observe = { path = "crates/observe" }
integrity = { path = "crates/integrity" }
normalise = { path = "crates/normalise" }
verdict = { path = "crates/verdict" }
destructive = { path = "crates/destructive" }
store = { path = "crates/store" }
probe = { path = "crates/probe" }

[workspace.lints.rust]
unsafe_code = "warn"
missing_docs = "warn"
