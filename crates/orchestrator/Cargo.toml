[package]
name = "orchestrator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
datamodel.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
intake.workspace = true
discovery.workspace = true
census.workspace = true
planner.workspace = true
world.workspace = true
argsynth.workspace = true
sandbox.workspace = true
observe.workspace = true
integrity.workspace = true
normalise.workspace = true
verdict.workspace = true
destructive.workspace = true
store.workspace = true
# Named directly (not just transitively via `store`) so `queue.rs` can name
# `rusqlite::Error` in `QueueError::Db`. Same `0.32` line `store` already depends on —
# Cargo unifies features across one resolved version, so this does not need to repeat
# `store`'s `bundled` feature to get it (the same reasoning `xtask/Cargo.toml` already
# documents for its own direct `rusqlite` dependency).
rusqlite = "0.32"

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
