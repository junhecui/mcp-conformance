[package]
name = "store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
datamodel.workspace = true
normalise.workspace = true
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.11.0"

[lints]
workspace = true

[dev-dependencies]
evtree.workspace = true
tempfile = "3.27.0"
# Integration tests only: `crates/store/tests/verdict_derivation.rs` exercises the whole
# std-side chain (stored bytes -> normalise -> verdict -> VERDICT row). `cargo purity`
# excludes dev-dependencies by policy (`xtask/src/purity.rs`), and this is not a runtime
# edge — `store` does not depend on `verdict`.
verdict.workspace = true
