[package]
name = "argsynth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
serde_json = "1.0.151"

# Only for a test that binds an argument to a real, concrete entity from the generic
# fixture (P2-05) — `world::SEEDED_DATABASE_PATH` — rather than a hardcoded string that
# could silently drift from what that crate actually seeds. `world` is Linux-gated
# (it builds on `sandbox::base_layer`), so this dependency and the test using it both are.
[target.'cfg(target_os = "linux")'.dev-dependencies]
world.workspace = true

[lints]
workspace = true
