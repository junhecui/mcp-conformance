[package]
name = "probe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Track B — protocol-probe oracle. Not in architecture.md §8's original crate list (that
# doc predates Track B); added the same way `datamodel` was added beyond §8 in F-02, and
# noted here for the same reason.
#
# Depends on `discovery` for exactly one thing: the pure JSON-RPC framing helpers
# (`discovery::jsonrpc::encode_request`/`encode_notification`). It does NOT depend on
# `discovery::DiscoveryClient` or `discovery::transport` — those are the crate whose whole
# point is that it cannot call a tool (P0-01), and this crate's whole point is that it
# does, deliberately, against a live Class B server. See `src/client.rs`.
[dependencies]
datamodel.workspace = true
discovery.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
ureq = { version = "3.3.0", features = ["rustls"] }

[lints]
workspace = true
